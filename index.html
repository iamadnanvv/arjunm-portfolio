<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A0A0B" />
  <title>Arjun M — Cinematographer &amp; Visual Editor</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, sans-serif; background: #0A0A0B; color: #F3F0EA; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 2rem; text-align: center; }
    p { color: #94908A; line-height: 1.6; }
    a { color: #C9A24B; }
  </style>
</head>
<body>
  <main>
    <h1>Loading Arjun M’s portfolio</h1>
    <p id="status">Preparing the projects and portfolio…</p>
  </main>
  <script>
    (async function () {
      const sourceUrl = 'https://raw.githubusercontent.com/iamadnanvv/arjunm-portfolio/ddc53a6f0a9f5856fff5040332174cdfe8c3f223/index.html';
      try {
        const response = await fetch(sourceUrl);
        if (!response.ok) throw new Error('Portfolio could not be loaded.');
        const source = await response.text();
        const page = new DOMParser().parseFromString(source, 'text/html');

        // Remove the complete behind-the-scenes section and its navigation entries.
        page.querySelector('#gallery')?.remove();
        page.querySelectorAll('a[href="#gallery"]').forEach(link => link.remove());

        // Keep the project URLs intact, moving each one onto a consistently styled CTA.
        page.querySelectorAll('#projects .bento-card').forEach(card => {
          const originalLink = card.matches('a[href]')
            ? card
            : card.querySelector('.project-card-link[href], a[href]');
          if (!originalLink) return;

          const href = originalLink.getAttribute('href');
          const target = originalLink.getAttribute('target') || '_blank';
          const rel = originalLink.getAttribute('rel') || 'noopener noreferrer';

          if (card.matches('a[href]')) {
            const replacement = page.createElement('div');
            [...card.attributes].forEach(attribute => {
              if (!['href', 'target', 'rel'].includes(attribute.name)) {
                replacement.setAttribute(attribute.name, attribute.value);
              }
            });
            while (card.firstChild) replacement.appendChild(card.firstChild);
            card.replaceWith(replacement);
            card = replacement;
          } else {
            card.querySelectorAll('.project-card-link, a[href]').forEach(link => link.remove());
          }

          const button = page.createElement('a');
          button.className = 'project-watch-button';
          button.href = href;
          button.target = target;
          button.rel = rel;
          button.setAttribute('aria-label', 'Watch the edits for ' + (card.querySelector('h3')?.textContent.trim() || 'this project'));
          button.innerHTML = '<span>Watch the Edits</span><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M17 7H8M17 7v9"/></svg>';
          card.appendChild(button);
        });

        const styles = page.createElement('style');
        styles.textContent = `
          #projects .bento-card { position: relative; }
          #projects .project-watch-button {
            position: absolute; z-index: 30; top: 50%; left: 50%;
            transform: translate(-50%, -50%); display: inline-flex;
            align-items: center; justify-content: center; gap: .65rem;
            min-width: 168px; padding: .85rem 1.15rem;
            border: 1px solid rgba(201,162,75,.8); border-radius: 9999px;
            background: rgba(10,10,11,.82); color: #F3F0EA;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            font: 500 10px/1.2 'JetBrains Mono', monospace;
            letter-spacing: .14em; text-transform: uppercase; text-decoration: none;
            white-space: nowrap; transition: background .25s ease, color .25s ease, border-color .25s ease, transform .25s ease;
          }
          #projects .project-watch-button:hover,
          #projects .project-watch-button:focus-visible {
            transform: translate(-50%, -53%); background: #C9A24B;
            border-color: #C9A24B; color: #0A0A0B; outline: none;
          }
          #projects .project-watch-button:focus-visible { box-shadow: 0 0 0 3px rgba(243,240,234,.45); }
          @media (max-width: 480px) {
            #projects .project-watch-button { min-width: 154px; padding: .75rem .9rem; font-size: 9px; }
          }
        `;
        page.head.appendChild(styles);

        page.querySelector('#testimonials .eyebrow')?.replaceChildren('07 — WORDS FROM CLIENTS');
        page.querySelector('#contact .eyebrow')?.replaceChildren('08 — CONTACT');

        document.open();
        document.write('<!DOCTYPE html>\n' + page.documentElement.outerHTML);
        document.close();
      } catch (error) {
        document.getElementById('status').textContent = 'The portfolio could not be loaded. Please try again shortly.';
      }
    })();
  </script>
</body>
</html>
